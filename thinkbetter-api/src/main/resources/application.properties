# --- Servidor ----------------------------------------------------------
# 0.0.0.0 = aceita conexões do Wi-Fi (celular), não só do próprio notebook
server.address=0.0.0.0
server.port=8080

# --- Banco ---------------------------------------------------------------
# O banco fica só no notebook (127.0.0.1); o celular nunca fala com ele direto.
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/thinkbetter?serverTimezone=America/Sao_Paulo
spring.datasource.username=api
# Use a mesma senha do CREATE USER do thinkbetter_v2_alteracoes.sql
spring.datasource.password=${DB_PASSWORD}

# --- JSON ----------------------------------------------------------------
# Datas como "1975-11-07" (e não como número)
spring.jackson.serialization.write-dates-as-timestamps=false
